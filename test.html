function pool(){return Q.filter(x=>(tema=="all"||x.t==tema)&&(modo=="all"||(st.h[x.i]&&st.h[x.i].last===0)))}
function score(){const p=pool(),seen=p.filter(x=>st.h[x.i]),ok=seen.filter(x=>st.h[x.i].last===1).length;
 const s=st.log.filter(r=>r.d==new Date().toDateString());document.getElementById("score").textContent=
 `Hoy ${s.filter(r=>r.ok).length}/${s.length} · vistas ${seen.length}/${p.length}`}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function next(){let p=pool();if(!p.length){document.getElementById("q").textContent=modo=="fail"?"No hay falladas. ¡Bien!":"Sin preguntas.";
 document.getElementById("opts").innerHTML="";document.getElementById("meta").textContent="";score();return}
 if(!deck.length){const unseen=shuffle(p.filter(x=>!st.h[x.i])),rest=shuffle(p.filter(x=>st.h[x.i])).sort((a,b)=>st.h[a.i].last-st.h[b.i].last);deck=unseen.concat(rest)}
 cur=deck.shift();done=false;document.getElementById("meta").textContent=`${cur.t} · ${cur.c}`;
 document.getElementById("q").textContent=cur.q;document.getElementById("msg").textContent="";
 const o=document.getElementById("opts");o.innerHTML="";cur.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";
 b.innerHTML="<b>"+"abcdef"[k]+")</b>";b.append(t);b.onclick=()=>pick(k,b);o.append(b)});score();window.scrollTo(0,0)}
function pick(k,b){if(done)return;done=true;const ok=k===cur.a,btns=[...document.querySelectorAll(".opt")];
 btns[cur.a].classList.add("ok");if(!ok)b.classList.add("ko");
 document.getElementById("msg").textContent=ok?"✓ Correcta":"✗ Era la "+"abcdef"[cur.a]+")";
 const h=st.h[cur.i]||{n:0,ok:0};h.n++;h.ok+=ok?1:0;h.last=ok?1:0;st.h[cur.i]=h;
 st.log.push({d:new Date().toDateString(),i:cur.i,ok,pick:"abcdef"[k]});if(st.log.length>3000)st.log.shift();save();score()}
document.getElementById("next").onclick=next;
document.querySelectorAll("#tema button").forEach(b=>b.onclick=()=>{tema=b.dataset.t;deck=[];document.querySelectorAll("#tema button").forEach(x=>x.classList.toggle("on",x==b));next()});
document.querySelectorAll("#modo button").forEach(b=>b.onclick=()=>{modo=b.dataset.m;deck=[];document.querySelectorAll("#modo button").forEach(x=>x.classList.toggle("on",x==b));next()});
document.getElementById("exp").onclick=()=>{const by=Object.fromEntries(Q.map(x=>[x.i,x]));const lines=st.log.map(r=>{const x=by[r.i];if(!x)return"";
 return `${r.d} | ${x.t} | ${x.c} | ${r.ok?"BIEN":"MAL"} | ${x.q} | tú: ${r.pick}) ${x.o["abcdef".indexOf(r.pick)]||""} | correcta: ${"abcdef"[x.a]}) ${x.o[x.a]}`});
 const t="MyMT test rápido · export\n"+lines.join("\n");navigator.clipboard.writeText(t).then(()=>alert(`Copiadas ${lines.length} respuestas`),()=>prompt("Copia:",t))};
next();
</script></body></html>
